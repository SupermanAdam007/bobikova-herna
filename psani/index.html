<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psaní | Bobíkova herna</title>
<link rel="icon" type="image/png" href="../obrazky/bobik-ikona.png">
<link rel="apple-touch-icon" href="../obrazky/bobik-ikona.png">

<link rel="stylesheet" href="../spolecne/spolecne.css">
<style>
  #pas { flex: none; display: flex; gap: 5px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: thin; }
  .polozka {
    flex: none; min-width: 44px; height: 44px; border-radius: 10px; border: 3px solid #fff; background: #3b4a8f; color: #fff;
    font-size: 20px; font-weight: 700; cursor: pointer; padding: 0 8px; position: relative;
  }
  .polozka.vybrana { background: #fff; color: #1f2a5a; border-color: #ffe066; outline: 3px solid #000; }
  .polozka.hotovo::after { content: "⭐"; position: absolute; right: -6px; top: -9px; font-size: 14px; }
  #platno { flex: 1; min-height: 0; position: relative; background: #fffdf5; border-radius: 16px; border: 4px solid #ffe066; overflow: hidden; }
  #platno canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #kresba { touch-action: none; cursor: crosshair; }
  #chybi { pointer-events: none; }
  #postup { flex: none; height: 14px; background: #050818; border: 2px solid #fff; border-radius: 8px; overflow: hidden; position: relative; }
  #postupPlny { height: 100%; width: 0; background: #51cf66; transition: width .25s; }
  #postupCil { position: absolute; top: 0; bottom: 0; left: 75%; width: 3px; background: #fff; }
  #tlacitka { flex: none; display: flex; gap: 6px; }
  #tlacitka .tlacitko { flex: 1; }
  #dalsi { background: #2b8a3e; flex: 1.4 !important; }
</style>
</head>
<body>
  <div id="top">
    <a class="domu" href="../index.html"><img class="logo" src="../obrazky/bobik.jpg" alt=""> Herna</a>
    <h1>✏️ Psaní</h1>
    <span class="hvezdy" id="hvezdy"></span>
    <button class="kulate" id="zvuk" title="Zvuk">🔊</button>
  </div>

  <div class="zalozky" id="zalozky">
    <button data-m="male" class="aktivni">a malá</button>
    <button data-m="velke">A velká</button>
  </div>

  <div id="pas"></div>
  <div id="hlaska">Obtáhni písmeno prstem. Drž se čáry!</div>

  <div id="platno">
    <canvas id="podklad"></canvas>
    <canvas id="kresba"></canvas>
    <canvas id="chybi"></canvas>
  </div>
  <div id="postup" title="Kolik jsi obtáhl"><div id="postupPlny"></div><div id="postupCil"></div></div>

  <div id="tlacitka">
    <button class="tlacitko" id="smazat">🗑 Znovu</button>
    <button class="tlacitko" id="poslech">🔊 Poslechni</button>
    <button class="tlacitko" id="dalsi">Další ➡️</button>
  </div>

<script src="../spolecne/spolecne.js"></script>
<script src="../spolecne/pismena.js"></script>
<script src="pismena-data.js"></script>
<script>
const $ = id => document.getElementById(id);
Hry.nastavTlacitkoZvuku($("zvuk"));

const jmena = ["ahoj", "skvele1", "skvele2", "skvele3", "zkus1", "zkus2", "konec"];
PISMENA.forEach(p => jmena.push("obtahni_" + p.id));
Hry.nactiHlas("zvuky/", jmena).then(() => Hry.rekni("ahoj", { delay: 200 }));

const PRAH_POKRYTI = 0.85;   // kolik z písmene musí být obtažené
const MAX_MIMO = 0.35;       // kolik čmáranice smí být mimo písmeno
const PRAH_CASTI = 0.6;      // každá samostatná část (háček, čárka, tečka) musí být obtažená aspoň takto

let rezim = "male", polozky = [], index = 0, tahy = [], hotovo = Hry.nacti("psani_hotovo", {}), zamceno = false, kresli = null;
const pod = $("podklad"), kre = $("kresba"), chy = $("chybi");
const cp = pod.getContext("2d"), ck = kre.getContext("2d"), cc = chy.getContext("2d");
let W = 0, H = 0, dpr = 1, S = 0, XH = 0, xText = 0, yZakl = 0;

function hlaska(t, cls = "") { const h = $("hlaska"); h.textContent = t; h.className = cls; }

// ---------- Položky k obtahování ----------
function sestavPolozky() {
  if (rezim === "male") polozky = PISMENA.map(p => ({ klic: "m_" + p.id, text: p.male, hlas: "obtahni_" + p.id }));
  else polozky = PISMENA.map(p => ({ klic: "v_" + p.id, text: p.velke, hlas: "obtahni_" + p.id }));
  const pas = $("pas"); pas.innerHTML = "";
  polozky.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "polozka" + (hotovo[p.klic] ? " hotovo" : ""); b.id = "p" + i; b.textContent = p.text;
    b.onclick = () => { Hry.zvuky.klik(); vyber(i, true); };
    pas.appendChild(b);
  });
}
function vyber(i, mluv) {
  index = i; zamceno = false; tahy = []; clearTimeout(napovedaCas);
  document.querySelectorAll(".polozka").forEach((b, j) => b.classList.toggle("vybrana", j === i));
  const el = $("p" + i); if (el) el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  Hry.uklidOslavu(); cc.clearRect(0, 0, W, H);
  hlaska("Obtáhni písmeno prstem. Drž se čáry!");
  nastavPostup(0); nakresliPodklad(false); ck.clearRect(0, 0, W, H);
  if (mluv) Hry.rekni(polozky[i].hlas, { delay: 150 });
  const hot = Object.keys(hotovo).filter(k => polozky.some(p => p.klic === k)).length;
  $("hvezdy").textContent = "⭐ " + hot + "/" + polozky.length;
}

// ---------- Plátno a písmo ----------
function velikost() {
  const r = $("platno").getBoundingClientRect();
  W = Math.max(10, r.width - 8); H = Math.max(10, r.height - 8);  // minus rámeček
  dpr = Math.min(2, window.devicePixelRatio || 1);
  for (const c of [pod, kre, chy]) { c.width = W * dpr; c.height = H * dpr; }
  for (const c of [cp, ck, cc]) c.setTransform(dpr, 0, 0, dpr, 0, 0);
  rozlozeni();
}
// Předloha je výřez z originálního vzorového listu (psani/pismena/*.png, výška malého písmene = 140 px, včetně směrových šipek).
// K ní patří logická maska písmene (*_maska.png), podle které se vyhodnocuje. Háčky, čárky, kroužky a tečky
// se dokreslují jako krátké čáry (PISMO[znak].z).
const OBR = {};
function nactiObrazky() {
  const sl = [];
  for (const k of Object.keys(PISMO)) for (const soubor of [PISMO[k].f, PISMO[k].k]) {
    if (OBR[soubor]) continue;
    sl.push(new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = "pismena/" + soubor; OBR[soubor] = im; }));
  }
  return Promise.all(sl);
}
function sirkaPisma(t) { const g = PISMO[t]; return { od: g.u0, sirka: Math.max(0.5, g.u1 - g.u0) }; }
function rozlozeni() {
  const t = polozky[index] ? polozky[index].text : "a";
  const sz = sirkaPisma(t);
  XH = Math.min(H * 0.24, (W * 0.84) / sz.sirka);
  S = XH * 2.3;
  xText = (W - sz.sirka * XH) / 2 - sz.od * XH;
  yZakl = H * 0.66;
}
// obrázek písmene (soubor) s okrajem rozšířeným o poloměr r (několik kruhů posunutých kopií)
function obrazek(c, t, soubor, r) {
  const g = PISMO[t], im = OBR[soubor], k = XH / 140;
  const ox = xText - g.bx * k, oy = yZakl - g.by * k, w = g.w * k, h = g.h * k;
  c.drawImage(im, ox, oy, w, h);
  if (r < 1) return;
  for (const f of [1 / 3, 2 / 3, 1]) {
    const rr = r * f, n = Math.max(8, Math.min(40, Math.ceil(rr * 2.4)));
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      c.drawImage(im, ox + Math.cos(a) * rr, oy + Math.sin(a) * rr, w, h);
    }
  }
}
function znacky(c, t, sirka) {
  c.lineJoin = "round"; c.lineCap = "round"; c.lineWidth = sirka;
  const X = u => xText + u * XH, Y = w => yZakl - w * XH;
  for (const z of PISMO[t].z) {
    c.beginPath(); z.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1]))); c.stroke();
    if (z.length === 2 && Math.hypot(z[1][0] - z[0][0], z[1][1] - z[0][1]) < 0.05) { c.beginPath(); c.arc(X(z[0][0]), Y(z[0][1]), sirka / 2, 0, 7); c.fill(); }
  }
}
// maska písmene rozšířená o poloměr r (pro vyhodnocení)
function maskaDo(c, t, r) {
  obrazek(c, t, PISMO[t].k, r);
  c.fillStyle = c.strokeStyle = "#000"; znacky(c, t, Math.max(2, 2 * r));
}
// zabarvená maska na pomocném plátně
function barevne(t, r, barva) {
  const o = document.createElement("canvas"); o.width = W * dpr; o.height = H * dpr;
  const x = o.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  maskaDo(x, t, r);
  x.globalCompositeOperation = "source-in"; x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = barva; x.fillRect(0, 0, o.width, o.height);
  return o;
}
function nakresliPodklad(hotovoZelene) {
  rozlozeni();
  cp.clearRect(0, 0, W, H);
  // linky: účaří, výška malých písmen a výška velkých písmen
  cp.save();
  cp.strokeStyle = "#74c0fc"; cp.lineWidth = 2; cp.setLineDash([]);
  cp.beginPath(); cp.moveTo(0, yZakl); cp.lineTo(W, yZakl); cp.stroke();
  cp.strokeStyle = "#a5d8ff"; cp.setLineDash([8, 6]);
  for (const y of [yZakl - XH, yZakl - 2 * XH]) { cp.beginPath(); cp.moveTo(0, y); cp.lineTo(W, y); cp.stroke(); }
  cp.restore();
  const t = polozky[index].text;
  if (hotovoZelene) cp.drawImage(barevne(t, XH * 0.06, "rgba(81,207,102,.55)"), 0, 0, W, H);
  // předloha: originální výřez, značky nad písmenem jsou dokreslené stejnou tmavou čarou
  obrazek(cp, t, PISMO[t].f, 0);
  cp.fillStyle = cp.strokeStyle = "#141414"; znacky(cp, t, Math.max(3, XH * 0.03));
}
function sirkaStopy() { return Math.max(12, S * 0.085); }

// ---------- Kreslení prstem ----------
function bod(e) { const r = kre.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }
function cara(c, a, b, sirka) {
  c.beginPath(); c.moveTo(a.x * W, a.y * H); c.lineTo(b.x * W, b.y * H); c.stroke();
}
function nastavStopu(c, sirka, barva) { c.lineCap = "round"; c.lineJoin = "round"; c.lineWidth = sirka; c.strokeStyle = barva; c.fillStyle = barva; }
kre.addEventListener("pointerdown", e => {
  if (zamceno) return;
  e.preventDefault(); try { kre.setPointerCapture(e.pointerId); } catch (x) {}
  cc.clearRect(0, 0, W, H); clearTimeout(napovedaCas);
  kresli = [bod(e)]; tahy.push(kresli);
  nastavStopu(ck, sirkaStopy(), "#1971c2");
  ck.beginPath(); ck.arc(kresli[0].x * W, kresli[0].y * H, sirkaStopy() / 2, 0, 7); ck.fill();
});
kre.addEventListener("pointermove", e => {
  if (!kresli) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  nastavStopu(ck, sirkaStopy(), "#1971c2");
  for (const ev of (evs.length ? evs : [e])) {
    const p = bod(ev), q = kresli[kresli.length - 1];
    cara(ck, q, p); kresli.push(p);
  }
});
const konecTahu = e => { if (!kresli) return; kresli = null; vyhodnot(); };
kre.addEventListener("pointerup", konecTahu);
kre.addEventListener("pointercancel", konecTahu);

// ---------- Vyhodnocení ----------
// Hra posuzuje čtyři věci:
//  1. pokrytí: kolik z koridoru kolem písmene je obtažené,
//  2. díry: největší souvislý neobtažený kus nesmí být velký (nejde přeskočit celou část písmene),
//  3. samostatné části (háček, čárka, tečka) se musí obtáhnout každá zvlášť,
//  4. čmáranice: kolik nakresleného leží daleko od písmene.
const POKR_NASOB = 1.9;       // šířka čáry při měření pokrytí (násobek šířky stopy)
const MAX_DIRA = 0.08;        // největší neobtažený souvislý kus jako podíl celého písmene
function malePlatno() { const c = document.createElement("canvas"); c.width = Math.round(W / 2); c.height = Math.round(H / 2); return c; }
function data(c) { return c.getContext("2d").getImageData(0, 0, c.width, c.height).data; }
function vykresliTahy(c, sirka) {
  const x = c.getContext("2d"); x.setTransform(c.width / W, 0, 0, c.height / H, 0, 0);
  x.lineCap = "round"; x.lineJoin = "round"; x.lineWidth = sirka; x.strokeStyle = x.fillStyle = "#000";
  for (const t of tahy) {
    x.beginPath(); x.arc(t[0].x * W, t[0].y * H, sirka / 2, 0, 7); x.fill();
    x.beginPath(); t.forEach((p, i) => i ? x.lineTo(p.x * W, p.y * H) : x.moveTo(p.x * W, p.y * H)); x.stroke();
  }
}
function vyhodnot() {
  const t = polozky[index].text;
  const mask = malePlatno(), tol = malePlatno(), pokr = malePlatno(), uziv = malePlatno(), stred = malePlatno();
  for (const [c, r] of [[mask, XH * 0.03], [tol, XH * 0.22]]) {
    const x = c.getContext("2d"); x.setTransform(c.width / W, 0, 0, c.height / H, 0, 0); maskaDo(x, t, r);
  }
  vykresliTahy(pokr, sirkaStopy() * POKR_NASOB);   // čára nemusí sedět úplně přesně
  vykresliTahy(uziv, sirkaStopy());
  vykresliTahy(stred, sirkaStopy() * 1.2);          // pro drobné části: čára musí opravdu ležet na nich
  const m = data(mask), tl = data(tol), p = data(pokr), u = data(uziv), sd = data(stred);
  const w = mask.width, h = mask.height;
  let celkem = 0, pokryto = 0, uzivPix = 0, mimo = 0;
  const nepokryte = new Uint8Array(w * h);
  const chybejici = malePlatno(), cx = chybejici.getContext("2d"), ci = cx.createImageData(w, h);
  for (let i = 3; i < m.length; i += 4) {
    if (m[i] > 100) {
      celkem++;
      if (p[i] > 40) pokryto++;
      else { nepokryte[(i - 3) / 4] = 1; ci.data[i - 3] = 255; ci.data[i - 2] = 200; ci.data[i - 1] = 0; ci.data[i] = 255; }
    }
    if (u[i] > 40) { uzivPix++; if (tl[i] < 40) mimo++; }
  }
  cx.putImageData(ci, 0, 0);
  const pokryti = celkem ? pokryto / celkem : 0;
  const mimoPodil = uzivPix ? mimo / uzivPix : 0;
  // největší souvislý neobtažený kus
  const diry = souvisleCasti(w, h, i => nepokryte[i] === 1);
  const nejvetsiDira = diry.reduce((a, c) => Math.max(a, c.length), 0) / Math.max(1, celkem);
  const maDiru = nejvetsiDira > MAX_DIRA;
  // samostatné části písmene (háček, čárka, tečka nad i) se hodnotí zvlášť
  const casti = souvisleCasti(w, h, i => m[i * 4 + 3] > 100);
  let chybiCast = false;
  const nejvetsi = casti.reduce((a, c) => Math.max(a, c.length), 0);
  for (const c of casti) {
    // hlavní tělo se hodnotí shovívavě, další části (háček, čárka, kroužek, tečka) přísněji a užší čarou
    const vedlejsi = c.length < nejvetsi * 0.5;
    const pole = vedlejsi ? sd : p;
    let ok = 0;
    for (const i of c) if (pole[i * 4 + 3] > 40) ok++;
    if (ok / c.length < (vedlejsi ? 0.55 : PRAH_CASTI)) chybiCast = true;
  }
  const chybi = chybiCast || maDiru;
  nastavPostup(chybi ? Math.min(pokryti, PRAH_POKRYTI - 0.05) : pokryti);
  window.posledniVyhodnoceni = { pokryti, mimoPodil, nejvetsiDira, chybiCast };
  if (pokryti >= PRAH_POKRYTI && !chybi && mimoPodil <= MAX_MIMO) return uspech();
  neuspech(pokryti, mimoPodil, chybejici, chybiCast && !maDiru && pokryti >= PRAH_POKRYTI);
}
// rozdělí body, pro které platí test, na samostatné souvislé části (bez drobných šumů)
function souvisleCasti(w, h, test) {
  const videno = new Uint8Array(w * h), casti = [];
  for (let start = 0; start < w * h; start++) {
    if (videno[start] || !test(start)) continue;
    const zasobnik = [start], cast = []; videno[start] = 1;
    while (zasobnik.length) {
      const i = zasobnik.pop(); cast.push(i);
      const x = i % w, y = (i / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const j = ny * w + nx;
        if (!videno[j] && test(j)) { videno[j] = 1; zasobnik.push(j); }
      }
    }
    if (cast.length >= 3) casti.push(cast);
  }
  return casti;
}
function nastavPostup(p) { $("postupPlny").style.width = Math.round(Math.min(1, p) * 100) + "%"; }

async function uspech() {
  zamceno = true;
  const p = polozky[index];
  hotovo[p.klic] = true; Hry.uloz("psani_hotovo", hotovo);
  $("p" + index).classList.add("hotovo");
  nastavPostup(1); ck.clearRect(0, 0, W, H);
  nakresliPodklad(true);
  hlaska("✔ Krásně! " + p.text, "dobre");
  Hry.zvuky.spravne(); Hry.oslava(false, "⭐ Výborně! ⭐");
  const vse = polozky.every(x => hotovo[x.klic]);
  const hot = Object.keys(hotovo).filter(k => polozky.some(x => x.klic === k)).length;
  $("hvezdy").textContent = "⭐ " + hot + "/" + polozky.length;
  await Hry.rekni(vse ? "konec" : "skvele", { delay: 350 });
  await Hry.sleep(500);
  if (zamceno && index === polozky.indexOf(p)) dalsiPolozka();
}
let napovedaCas = null;
function neuspech(pokryti, mimoPodil, chybejici, chybiJenCast) {
  clearTimeout(napovedaCas);
  if (chybiJenCast && mimoPodil <= MAX_MIMO) {
    // hlavní tvar je hotový, dítě asi jen dokresluje háček nebo čárku: nespěchat a nehodnotit hned
    hlaska("Ještě dokresli háček, čárku nebo tečku!");
    napovedaCas = setTimeout(() => {
      if (zamceno || kresli) return;
      Hry.zvuky.spatne(); hlaska("Chybí ještě háček, čárka nebo tečka. Podívej se na žluté místo!", "spatne");
      cc.clearRect(0, 0, W, H); cc.globalAlpha = .9; cc.drawImage(chybejici, 0, 0, W, H); cc.globalAlpha = 1;
      setTimeout(() => cc.clearRect(0, 0, W, H), 2500);
      Hry.rekni("zkus");
    }, 3500);
    return;
  }
  Hry.zvuky.spatne();
  if (mimoPodil > MAX_MIMO) {
    hlaska("Moc čmárání mimo čáru. Smaž to a obtáhni to pomalu.", "spatne");
    $("smazat").style.animation = "pulz .6s 4";
    setTimeout(() => $("smazat").style.animation = "", 2600);
  } else {
    hlaska("Ještě něco chybí. Dokresli žlutá místa!", "spatne");
    // ukaž chybějící části žlutě
    cc.clearRect(0, 0, W, H); cc.globalAlpha = .9; cc.drawImage(chybejici, 0, 0, W, H); cc.globalAlpha = 1;
    setTimeout(() => cc.clearRect(0, 0, W, H), 2500);
  }
  if (!zamceno) Hry.rekni("zkus", { delay: 300 });
}
function dalsiPolozka() {
  Hry.uklidOslavu();
  let i = index;
  for (let k = 1; k <= polozky.length; k++) {
    const j = (index + k) % polozky.length;
    if (!hotovo[polozky[j].klic]) { i = j; break; }
    if (k === polozky.length) i = (index + 1) % polozky.length;
  }
  vyber(i, true);
}

$("smazat").onclick = () => { Hry.zvuky.klik(); zamceno = false; tahy = []; ck.clearRect(0, 0, W, H); cc.clearRect(0, 0, W, H); nastavPostup(0); nakresliPodklad(false); hlaska("Zkus to znovu. Drž se čáry!"); };
$("poslech").onclick = () => Hry.rekni(polozky[index].hlas);
$("dalsi").onclick = () => { Hry.zvuky.klik(); dalsiPolozka(); };
