<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Vizitky Bobíkova herna</title>
<style>
  /* Tisková velikost 90 x 50 mm + 3 mm spadávka ze všech stran = 96 x 56 mm */
  @page { size: 96mm 56mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #888; }
  .strana { width: 96mm; height: 56mm; position: relative; overflow: hidden; page-break-after: always; break-after: page; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  @media screen { .strana { margin: 8mm auto; box-shadow: 0 2mm 6mm #0006; } }
  /* bezpečná zóna: 3 mm spadávka + 4 mm okraj textu */
  .obsah { position: absolute; inset: 7mm; }

  .predni { background: #1d2c5b; color: #fff; }
  .predni .bobik { position: absolute; left: -1mm; bottom: -1mm; height: 50mm; width: 50mm; mix-blend-mode: lighten; }
  .predni .text { position: absolute; left: 7mm; top: 7mm; width: 45mm; text-align: left; }
  .predni h1 { font-size: 6.4mm; line-height: 1; letter-spacing: -.1mm; color: #ffd84a; margin-left: 33mm; margin-top: 2mm; }
  .predni h1 small { display: block; font-size: 3.1mm; color: #fff; letter-spacing: 0; margin-top: 1.4mm; font-weight: 600; }
  .predni .qr { position: absolute; right: 7mm; bottom: 7mm; width: 24mm; height: 24mm; background: #fff; padding: 1.6mm; border-radius: 2mm; }
  .predni .qr img { width: 100%; height: 100%; display: block; }
  .predni .pokyn { position: absolute; left: 7mm; bottom: 7.5mm; width: 48mm; font-size: 2.9mm; font-weight: 700; line-height: 1.25; color: #fff; }
  .predni .pokyn b { color: #ffd84a; }

  .zadni { background: #fff; color: #1d2c5b; }
  .zadni .jmeno { position: absolute; left: 7mm; top: 8mm; font-size: 6mm; font-weight: 800; letter-spacing: -.1mm; }
  .zadni .role { position: absolute; left: 7mm; top: 16mm; font-size: 3mm; font-weight: 600; color: #3b5a9a; line-height: 1.3; width: 48mm; }
  .zadni .web { position: absolute; left: 7mm; bottom: 7mm; font-size: 2.7mm; line-height: 1.5; font-weight: 600; }
  .zadni .web span { color: #3b5a9a; font-weight: 500; }
  .zadni .qr { position: absolute; right: 7mm; bottom: 7mm; width: 21mm; height: 21mm; }
  .zadni .qr img { width: 100%; height: 100%; display: block; }
  .zadni .qr-popis { position: absolute; right: 7mm; top: 8mm; width: 24mm; text-align: right; font-size: 2.6mm; font-weight: 700; line-height: 1.2; }
  .zadni::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4mm; background: #1d2c5b; }
  .zadni::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3.4mm; background: #ffd84a; }
</style>
</head>
<body>

<!-- PŘEDNÍ STRANA -->
<section class="strana predni">
  <img class="bobik" src="../obrazky/bobik.jpg" alt="">
  <h1 style="position:absolute;right:7mm;top:7mm;margin:0;text-align:right;width:44mm">Bobíkova herna<small>hry pro děti od 1. třídy</small></h1>
  <div class="pokyn" style="left:auto;right:36mm;bottom:9mm;width:26mm;text-align:right">Naskenuj a <b>hraj</b>!<br>Robot, abeceda, psaní.</div>
  <div class="qr"><img src="qr-hra.svg" alt="QR kód na Bobíkovu hernu"></div>
</section>

<!-- ZADNÍ STRANA -->
<section class="strana zadni">
  <div class="jmeno">Adam Pavlát</div>
  <div class="role">Autor Bobíkovy herny.<br>Rodiče, pojďme si psát.</div>
  <div class="web">linkedin.com/in/adam-pavlat<br><span>supermanadam007.github.io/bobikova-herna</span></div>
  <div class="qr-popis">LinkedIn</div>
  <div class="qr"><img src="qr-linkedin.svg" alt="QR kód na LinkedIn"></div>
</section>

</body>
</html>
