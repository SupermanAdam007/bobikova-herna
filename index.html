<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hry pro školáky</title>
<meta name="description" content="Hry pro děti na prvním stupni: programování, abeceda a psaní českých písmen.">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Trebuchet MS", "Comic Sans MS", sans-serif; background: #1f2a5a; color: #fff;
    height: 100dvh; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 10px;
  }
  h1 { margin: 0; text-align: center; font-size: clamp(22px, 5.5dvh, 44px); flex: none; }
  p.podtitul { margin: 0; text-align: center; font-size: clamp(14px, 2.6dvh, 20px); flex: none; opacity: .95; }
  main#hry { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; gap: 10px; max-width: 1100px; width: 100%; margin: 0 auto; }
  a.hra {
    display: flex; flex-direction: row; align-items: stretch; min-height: 0; background: #fff; color: #1f2a5a; text-decoration: none;
    border-radius: 20px; overflow: hidden; border: 4px solid #ffe066; box-shadow: 0 6px 0 rgba(0,0,0,.4); transition: transform .1s;
  }
  a.hra:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
  a.hra img { flex: 0 0 48%; min-width: 0; width: 48%; height: 100%; object-fit: contain; background: #fff; display: block; background: #fff; }
  .text { flex: 1; min-width: 0; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .text h2 { margin: 0; font-size: clamp(20px, 4.4dvh, 38px); }
  .text span { font-size: clamp(13px, 2.4dvh, 20px); line-height: 1.2; }
  .text b { align-self: flex-start; background: #e03131; color: #fff; border-radius: 14px; padding: 4px 14px; font-size: clamp(14px, 2.6dvh, 22px); margin-top: 2px; }
  @media (orientation: landscape) and (min-width: 700px) {
    main#hry { grid-template-columns: repeat(var(--sloupce, 3), 1fr); grid-auto-rows: auto; }
    a.hra { flex-direction: column; }
    a.hra img { flex: 1 1 auto; width: 100%; height: auto; min-height: 0; object-fit: cover; }
    .text { flex: none; }
  }
  #tridy { flex: none; display: flex; gap: 6px; justify-content: center; max-width: 1100px; width: 100%; margin: 0 auto; }
  #tridy button {
    flex: 1; max-width: 120px; border: 3px solid transparent; border-radius: 14px; padding: 6px 2px; font-family: inherit; font-weight: bold;
    font-size: clamp(14px, 2.8dvh, 22px); background: #3b4a8f; color: #fff; cursor: pointer; line-height: 1.1;
  }
  #tridy button small { display: block; font-size: .62em; font-weight: normal; opacity: .9; }
  #tridy button.aktivni { background: #fff; color: #1f2a5a; border-color: #ffe066; }
  #tridy button.prazdna:not(.aktivni) { opacity: .75; }
  .brzy {
    grid-column: 1 / -1; grid-row: 1 / -1; background: #3b4a8f; border: 4px dashed #ffe066; border-radius: 20px; padding: 16px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: clamp(16px, 3.2dvh, 26px);
  }
  .brzy .velke { font-size: clamp(48px, 12dvh, 110px); }
  .brzy button { border: none; border-radius: 16px; padding: 10px 22px; font-size: clamp(16px, 3dvh, 24px); font-family: inherit; font-weight: bold; background: #e03131; color: #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
  footer { flex: none; text-align: center; font-size: 12px; opacity: .8; }
</style>
</head>
<body>
  <h1>🎮 Hry pro školáky</h1>
  <p class="podtitul" id="podtitul">Vyber si třídu a hru.</p>
  <div id="tridy"></div>
  <main id="hry"></main>
  <footer>Hry nic neodesílají na internet a neptají se na jména.</footer>
<script>
// Hry podle ročníku: stačí přidat položku do HRY a nastavit třídu (nebo víc tříd najednou).
const HRY = [
  { trida: [1], href: "robot/", obrazek: "obrazky/robot.svg", alt: "Robot jde po cestě k cíli",
    nazev: "🤖 Robot Bobík", popis: "Poskládej program z kroků a pomoz robotovi dojít do cíle." },
  { trida: [1], href: "abeceda/", obrazek: "obrazky/abeceda.svg", alt: "Barevné kostky s písmeny A, B a Č",
    nazev: "🔤 Abeceda", popis: "Poznej písmena, poslouchej je a najdi správné." },
  { trida: [1], href: "psani/", obrazek: "obrazky/psani.svg", alt: "Tužka obtahuje psací písmeno",
    nazev: "✏️ Psaní", popis: "Obtahuj psací písmena české abecedy a nauč se je psát." },
];
const TRIDY = [1, 2, 3, 4, 5];
const $ = id => document.getElementById(id);
let trida = 1;
try { const u = parseInt(location.hash.slice(1) || localStorage.getItem("trida"), 10); if (TRIDY.includes(u)) trida = u; } catch (e) {}

function vykresli() {
  $("tridy").innerHTML = "";
  TRIDY.forEach(t => {
    const pocet = HRY.filter(h => h.trida.includes(t)).length;
    const b = document.createElement("button");
    b.className = (t === trida ? "aktivni " : "") + (pocet ? "" : "prazdna");
    b.innerHTML = t + ". třída<small>" + (pocet ? pocet + (pocet === 1 ? " hra" : pocet < 5 ? " hry" : " her") : "brzy") + "</small>";
    b.onclick = () => { trida = t; try { localStorage.setItem("trida", t); } catch (e) {} history.replaceState(null, "", "#" + t); vykresli(); };
    $("tridy").appendChild(b);
  });
  const hry = HRY.filter(h => h.trida.includes(trida));
  const m = $("hry"); m.innerHTML = "";
  $("podtitul").textContent = hry.length ? "Vyber si hru a klepni na ni." : "Tady zatím nic není.";
  if (!hry.length) {
    m.style.gridTemplateColumns = "1fr";
    m.innerHTML = '<div class="brzy"><div class="velke">🚧</div><div>Hry pro ' + trida + '. třídu se ještě chystají.<br>Zatím si můžeš zahrát hry pro 1. třídu.</div><button id="zpet">Hry pro 1. třídu</button></div>';
    $("zpet").onclick = () => { trida = 1; history.replaceState(null, "", "#1"); vykresli(); };
    return;
  }
  m.style.gridTemplateColumns = "";
  m.style.setProperty("--sloupce", hry.length);
  hry.forEach(h => {
    const a = document.createElement("a"); a.className = "hra"; a.href = h.href;
    a.innerHTML = '<img src="' + h.obrazek + '" alt="' + h.alt + '"><div class="text"><h2>' + h.nazev + '</h2><span>' + h.popis + '</span><b>Hrát ▶</b></div>';
    m.appendChild(a);
  });
}
vykresli();
</script>
</body>
</html>
