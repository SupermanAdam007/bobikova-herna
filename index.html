<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bobíkova herna</title>
<link rel="icon" type="image/png" href="obrazky/bobik-ikona.png">
<link rel="apple-touch-icon" href="obrazky/bobik-ikona.png">

<meta name="description" content="Hry pro děti na prvním stupni: programování, abeceda a psaní českých písmen.">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; font-family: "Trebuchet MS", "Comic Sans MS", sans-serif; background: #1f2a5a; color: #fff;
    min-height: 100dvh; display: flex; flex-direction: column; gap: 10px; padding: 10px 10px 0;
  }
  #hlavicka { flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .maskot { height: 72px; width: 72px; border-radius: 50%; border: 4px solid #ffe066; object-fit: cover; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
  h1 { margin: 0; font-size: clamp(24px, 7vw, 40px); }
  p.podtitul { margin: 2px 0 0; font-size: clamp(13px, 3.4vw, 20px); opacity: .95; }
  /* Obsah se může posouvat: dlaždice mají minimální výšku a stránka se při nedostatku místa rolovat */
  main#hry { flex: 1 0 auto; display: grid; grid-template-columns: 1fr; grid-auto-rows: minmax(124px, auto); gap: 10px; max-width: 1100px; width: 100%; margin: 0 auto; }
  a.hra {
    display: flex; flex-direction: row; align-items: stretch; min-height: 124px; background: #fff; color: #1f2a5a; text-decoration: none;
    border-radius: 18px; overflow: hidden; border: 3px solid #ffe066; box-shadow: 0 5px 0 rgba(0,0,0,.4); transition: transform .1s;
  }
  a.hra:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
  a.hra img { flex: 0 0 42%; min-width: 0; width: 42%; height: auto; object-fit: cover; display: block; background: #fff; }
  .text { flex: 1; min-width: 0; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .text h2 { margin: 0; font-size: 20px; line-height: 1.1; }
  .text span { font-size: 14px; line-height: 1.25; }
  .text b { align-self: flex-start; background: #e03131; color: #fff; border-radius: 14px; padding: 4px 14px; font-size: 15px; margin-top: 3px; }
  #tridy { flex: none; display: flex; gap: 6px; justify-content: center; max-width: 1100px; width: 100%; margin: 0 auto; }
  #tridy button {
    flex: 1; max-width: 120px; border: 3px solid transparent; border-radius: 14px; padding: 6px 0; font-family: inherit; font-weight: bold;
    font-size: 15px; background: #3b4a8f; color: #fff; cursor: pointer; line-height: 1.1; white-space: nowrap;
  }
  #tridy button small { display: block; font-size: 10px; font-weight: normal; opacity: .9; }
  #tridy button.aktivni { background: #fff; color: #1f2a5a; border-color: #ffe066; }
  #tridy button.prazdna:not(.aktivni) { opacity: .75; }
  .brzy {
    grid-column: 1 / -1; min-height: 220px; background: #3b4a8f; border: 4px dashed #ffe066; border-radius: 20px; padding: 16px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 18px;
  }
  .brzy .velke { font-size: 64px; }
  .brzy button { border: none; border-radius: 16px; padding: 10px 22px; font-size: 18px; font-family: inherit; font-weight: bold; background: #e03131; color: #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
  footer { flex: none; text-align: center; font-size: 12px; opacity: .8; }
  #rodice {
    flex: none; margin: 0 -10px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); background: #141c40; border-top: 2px solid #3b4a8f;
    text-align: center; font-size: 14px; color: #c9d0f2;
  }
  #rodice button { font: inherit; font-weight: bold; color: #ffe066; background: none; border: none; padding: 0; text-decoration: underline; cursor: pointer; }
  #zavora { position: fixed; inset: 0; background: rgba(10,14,38,.85); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #zavora.otevrena { display: flex; }
  #zavora .okno { background: #fff; color: #1f2a5a; border-radius: 20px; padding: 18px; max-width: 380px; width: 100%; text-align: center; border: 4px solid #ffe066; display: flex; flex-direction: column; gap: 10px; }
  #zavora h3 { margin: 0; font-size: 22px; }
  #zavora p { margin: 0; font-size: 16px; line-height: 1.3; }
  #zavora input { font: inherit; font-size: 26px; text-align: center; width: 8ch; align-self: center; border: 3px solid #3b4a8f; border-radius: 12px; padding: 6px; color: #1f2a5a; }
  #zavora .tlacitka { display: flex; gap: 8px; justify-content: center; }
  #zavora .tlacitka button { font: inherit; font-weight: bold; font-size: 16px; border: none; border-radius: 14px; padding: 10px 18px; cursor: pointer; background: #e03131; color: #fff; }
  #zavora .tlacitka button.sede { background: #dfe3f5; color: #1f2a5a; }
  #zavora .chyba { color: #c92a2a; font-weight: bold; min-height: 1.3em; }
  /* Mobil na šířku a nízké obrazovky: kompaktní hlavička, dlaždice ve dvou nebo třech sloupcích, stránka se posouvá */
  @media (orientation: landscape) and (min-width: 560px) {
    body { gap: 8px; padding: 8px 12px 0; }
    #hlavicka { gap: 10px; }
    .maskot { height: 48px; width: 48px; border-width: 3px; }
    h1 { font-size: 24px; }
    p.podtitul { display: none; }
    #tridy button { padding: 4px 0; font-size: 14px; }
    main#hry { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); grid-auto-rows: minmax(120px, auto); }
    a.hra img { flex-basis: 40%; width: 40%; }
    .text h2 { font-size: 18px; }
    .text span { font-size: 13px; }
  }
  /* Telefon na výšku: dlaždice pod sebou, obrázek vlevo */
  @media (max-width: 699px) and (orientation: portrait) {
    main#hry { grid-template-columns: 1fr; }
  }
  /* Tablety a počítače: dlaždice s obrázkem nahoře */
  @media (min-width: 900px) and (min-height: 560px) {
    body { gap: 14px; padding-top: 18px; }
    main#hry { grid-template-columns: repeat(auto-fit, 340px); grid-auto-rows: auto; justify-content: center; align-content: start; align-items: start; gap: 24px; max-width: 1200px; }
    a.hra { width: 340px; flex-direction: column; }
    a.hra img { flex: none; width: 100%; height: auto; aspect-ratio: 3 / 2; }
    .text { padding: 14px 16px 18px; gap: 6px; flex: none; }
    .text h2 { font-size: 26px; }
    .text span { font-size: 16px; min-height: 2.4em; }
    .text b { font-size: 18px; margin-top: 8px; }
    .brzy { width: min(560px, 100%); justify-self: center; padding: 32px; }
    #tridy button { font-size: 18px; }
    .maskot { height: 96px; width: 96px; }
    h1 { font-size: 44px; }
    p.podtitul { display: block; font-size: 20px; }
  }
</style>
</head>
<body>
  <header id="hlavicka">
    <img src="obrazky/bobik.jpg" alt="Robot Bobík mává" class="maskot">
    <div><h1>Bobíkova herna</h1><p class="podtitul" id="podtitul">Ahoj, já jsem Bobík! Vyber si hru.</p></div>
  </header>
  <div id="tridy"></div>
  <main id="hry"></main>
  <footer>Bobíkova herna nic neodesílá na internet a neptá se na jména.</footer>
  <div id="rodice">Pro rodiče: autor her <button id="otevriZavoru" type="button">Adam Pavlát</button></div>
  <div id="zavora" role="dialog" aria-modal="true" aria-labelledby="zavNadpis">
    <div class="okno">
      <h3 id="zavNadpis">Jen pro dospělé</h3>
      <p>Tohle tě pošle mimo hry na LinkedIn. Rodiče, potvrďte věk zadáním roku narození.</p>
      <input id="rok" type="text" inputmode="numeric" maxlength="4" placeholder="rok" autocomplete="off" aria-label="Rok narození">
      <div class="chyba" id="zavChyba" aria-live="polite"></div>
      <div class="tlacitka"><button id="zavPokracuj" type="button">Pokračovat</button><button id="zavZpet" type="button" class="sede">Zpět ke hrám</button></div>
    </div>
  </div>
<script>
// Hry podle ročníku: stačí přidat položku do HRY a nastavit třídu (nebo víc tříd najednou).
const HRY = [
  { trida: [1], href: "robot/index.html", obrazek: "obrazky/robot.jpg", alt: "Robot jde po cestě k cíli",
    nazev: "🤖 Robot Bobík", popis: "Poskládej program z kroků a pomoz robotovi dojít do cíle." },
  { trida: [1], href: "abeceda/index.html", obrazek: "obrazky/abeceda.jpg", alt: "Barevné kostky s písmeny A, B a C",
    nazev: "🔤 Abeceda", popis: "Poznej písmena, poslouchej je a najdi správné." },
  { trida: [1], href: "psani/index.html", obrazek: "obrazky/psani.jpg", alt: "Tužka obtahuje psací písmeno",
    nazev: "✏️ Psaní", popis: "Obtahuj psací písmena české abecedy a nauč se je psát." },
  { trida: [1], href: "rady/index.html", obrazek: "obrazky/rady.jpg", alt: "Řada koček a psů a políčko s otazníkem",
    nazev: "🔁 Co bude dál?", popis: "Podívej se na řadu obrázků a vyber, co v ní bude dál." },
  { trida: [1], href: "scitani/index.html", obrazek: "obrazky/scitani.jpg", alt: "Robot Bobík drží jablka a vedle je znaménko plus",
    nazev: "➕ Sčítání", popis: "Sečti dvě čísla a vyber správný výsledek." },
  { trida: [1], href: "taxi/index.html", obrazek: "obrazky/taxi.jpg", alt: "Žlutý taxík skáče přes červené auto na dálnici",
    nazev: "🚕 Taxík na dálnici", popis: "Objíždí auta a přeskoč je, ať taxík dojede do cíle." },
];
const TRIDY = [1, 2, 3, 4, 5];
const $ = id => document.getElementById(id);
let trida = 1;
try { const u = parseInt(location.hash.slice(1) || localStorage.getItem("trida"), 10); if (TRIDY.includes(u)) trida = u; } catch (e) {}

function vykresli() {
  $("tridy").innerHTML = "";
  TRIDY.forEach(t => {
    const pocet = HRY.filter(h => h.trida.includes(t)).length;
    const b = document.createElement("button");
    b.className = (t === trida ? "aktivni " : "") + (pocet ? "" : "prazdna");
    b.innerHTML = t + ". třída<small>" + (pocet ? pocet + (pocet === 1 ? " hra" : pocet < 5 ? " hry" : " her") : "brzy") + "</small>";
    b.onclick = () => { trida = t; try { localStorage.setItem("trida", t); } catch (e) {} history.replaceState(null, "", "#" + t); vykresli(); };
    $("tridy").appendChild(b);
  });
  const hry = HRY.filter(h => h.trida.includes(trida));
  const m = $("hry"); m.innerHTML = "";
  $("podtitul").textContent = hry.length ? "Ahoj, já jsem Bobík! Vyber si hru." : "Tady zatím nic není, ale Bobík na tom pracuje.";
  if (!hry.length) {
    m.style.gridTemplateColumns = "1fr";
    m.innerHTML = '<div class="brzy"><div class="velke">🚧</div><div>Hry pro ' + trida + '. třídu se ještě chystají.<br>Zatím si můžeš zahrát hry pro 1. třídu.</div><button id="zpet">Hry pro 1. třídu</button></div>';
    $("zpet").onclick = () => { trida = 1; history.replaceState(null, "", "#1"); vykresli(); };
    return;
  }
  m.style.gridTemplateColumns = "";
  m.style.setProperty("--sloupce", hry.length);
  hry.forEach(h => {
    const a = document.createElement("a"); a.className = "hra"; a.href = h.href;
    a.innerHTML = '<img src="' + h.obrazek + '" alt="' + h.alt + '"><div class="text"><h2>' + h.nazev + '</h2><span>' + h.popis + '</span><b>Hrát ▶</b></div>';
    m.appendChild(a);
  });
}
vykresli();

// Bobík pozdraví hlasem. Prohlížeče zakazují zvuk před prvním dotykem, takže se pozdrav spustí
// hned, když to jde, jinak při prvním dotyku. Po návratu z hry se v téže návštěvě už nezopakuje.
const pozdrav = new Audio("zvuky/ahoj.mp3");
function pozdrav_prehraj() { pozdrav.currentTime = 0; return pozdrav.play(); }
let uzPozdravil = false;
try { uzPozdravil = sessionStorage.getItem("pozdraveno") === "1"; } catch (e) {}
function oznacPozdraveno() { uzPozdravil = true; try { sessionStorage.setItem("pozdraveno", "1"); } catch (e) {} }
if (!uzPozdravil) {
  pozdrav_prehraj().then(oznacPozdraveno).catch(() => {
    const prvni = () => { if (!uzPozdravil) { pozdrav_prehraj().then(oznacPozdraveno).catch(() => {}); } };
    document.addEventListener("pointerdown", prvni, { once: true });
  });
}
document.querySelector(".maskot").onclick = () => pozdrav_prehraj().catch(() => {});
document.querySelector(".maskot").style.cursor = "pointer";

// Ochrana dětí: odkaz na LinkedIn se otevře až po zadání roku narození dospělého. Rok se nikam neukládá ani neodesílá.
const LINKEDIN = "https://www.linkedin.com/in/adam-pavlat/";
const zavora = $("zavora");
function zavriZavoru() { zavora.classList.remove("otevrena"); $("rok").value = ""; $("zavChyba").textContent = ""; }
$("otevriZavoru").onclick = () => { zavora.classList.add("otevrena"); $("rok").focus(); };
$("zavZpet").onclick = zavriZavoru;
zavora.onclick = e => { if (e.target === zavora) zavriZavoru(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") zavriZavoru(); });
function potvrdRok() {
  const rok = parseInt($("rok").value, 10), letos = new Date().getFullYear();
  if (!(rok >= 1900 && rok <= letos)) { $("zavChyba").textContent = "Zadejte rok narození čtyřmi číslicemi."; return; }
  if (letos - rok < 18) { $("zavChyba").textContent = "Tohle je jen pro dospělé. Vrať se ke hrám."; return; }
  zavriZavoru();
  window.open(LINKEDIN, "_blank", "noopener");
}
$("zavPokracuj").onclick = potvrdRok;
$("rok").onkeydown = e => { if (e.key === "Enter") potvrdRok(); };
</script>
</body>
</html>
